apiVersion: v1
kind: Namespace
metadata:
  name: ai-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  namespace: ai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-api
  template:
    metadata:
      labels:
        app: ai-api
    spec:
      initContainers:
      - name: install-deps
        image: python:3.12-slim
        command: ['pip', 'install', '--target=/deps', '-r', '/code/requirements.txt']
        volumeMounts:
        - name: code
          mountPath: /code
        - name: deps
          mountPath: /deps
      containers:
      - name: api
        image: python:3.12-slim
        command: ['python', '-m', 'uvicorn', 'main:app', '--host', '0.0.0.0', '--port', '8000']
        workingDir: /app
        env:
        - name: PYTHONPATH
          value: '/deps'
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: code
          mountPath: /app
        - name: deps
          mountPath: /deps
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
      volumes:
      - name: code
        configMap:
          name: api-code
      - name: deps
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-api
  namespace: ai-api
spec:
  type: NodePort
  selector:
    app: ai-api
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
