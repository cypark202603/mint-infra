apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mint
  namespace: argocd
spec:
  description: Mint Infrastructure
  sourceRepos:
    - https://github.com/cypark202603/mint-infra.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cypark202603/mint-infra.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
